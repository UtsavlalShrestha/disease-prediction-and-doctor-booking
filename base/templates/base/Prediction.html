{% extends 'main.html' %} 
{% load static %} 
{% block content %}
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>

<div class="container mt-5">
  <!-- Prediction Section -->
  <div class="card border-0 shadow-sm mb-5">
    <div class="card-body">
      <h3 class="text-primary mb-4">Possible Disease Outcomes</h3>
      <div>
        {% for prediction in predictions %}
          <div class="mb-3">
            <a
              href="{% url 'recommend_doctors' prediction.id %}"
              class="recommend-doctor-link"
            >
              <div class="clickable-section">
                <p class="mb-1 text-start">
                  <strong class="text-danger">{{ prediction.disease }}</strong>
                  <small>(Specialty: {{ prediction.specialty }})</small>
                  <!-- Custom Progress Bar -->
                  <div class="progress-container">
                    <div class="custom-progress-bar">
                      <div
                        class="custom-progress-fill"
                        style="width: {{ prediction.probability_percentage|floatformat:2 }}%;"
                      ></div>
                    </div>
                  </div>
                </p>
              </div>
            </a>
          </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>

<style>
  .progress-container {
    display: flex;
    align-items: flex-start;
    width: 150px;
    margin-top: 5px;
  }

  .custom-progress-bar {
    width: 100%;
    height: 10px;
    background-color: #e9ecef;
    border-radius: 6px;
    overflow: hidden;
  }

  .custom-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #3fb785, #36a374);
    transition: width 0.3s ease;
  }

  .recommend-doctor-link {
    text-decoration: none;
    display: block;
  }

  .clickable-section {
    border: 1px solid #e9ecef;
    padding: 15px;
    border-radius: 8px;
    background-color: #f8f9fa;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: pointer;
  }

  .clickable-section:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    background-color: #fff;
  }

  .clickable-section:active {
    transform: scale(0.98);
    box-shadow: none;
  }

  .text-primary {
    color: #3fb785 !important;
  }

  .text-danger {
    font-weight: bold;
  }
</style>
{% endblock content %}

{% block footer %}
<!-- Footer is excluded here -->
{% endblock footer %}
