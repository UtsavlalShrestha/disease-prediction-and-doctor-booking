{% extends 'main.html' %}
{% load static %}
{% block content %}

<!-- Page Styling -->
<link rel="stylesheet" type="text/css" href="{% static 'css/confirmOption.css' %}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<!-- Form Content -->
<form method="POST" class="confirmOption">
    {% csrf_token %}
    <p>Do you already have an account?</p>
    <button type="submit" name="Yes" formaction="{% url 'login' %}">Yes</button>
    <button type="submit" name="No" formaction="{% url 'signup' %}">No</button>

    <a href="/">Go back!</a>
</form>

{% endblock %}
