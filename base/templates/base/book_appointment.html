{% extends 'main.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<div class="container my-5">
    <div class="text-center mb-5">
        <h2 class="fw-bold">Book an Appointment with Dr. {{ doctor.name }}</h2>
        <p class="text-muted">{{ doctor.speciality }}</p>
    </div>
    
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <div class="row align-items-center">
                <div class="col-md-4 text-center mb-4">
                    <img src="{{ doctor.profile_picture.url }}" alt="Dr. {{ doctor.name }}"
                         class="img-fluid mb-2"
                         style="width: 270px; height: 270px; object-fit: cover; border: 3px solid #000000;">
                    <h4 class="mb-0">Dr. {{ doctor.name }}</h4>
                    <p class="text-muted">{{ doctor.speciality }}</p>
                </div>

                <div class="col-md-8">
                  <h5 class="fw-bold mb-4">Book Your Appointment</h5>

                    <form method="post" novalidate>
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="hospital" class="form-label">Select Hospital:</label>
                            <select name="hospital" id="hospital" class="form-control">
                                {% for hospital in doctor.hospitals.all %}
                                    <option value="{{ hospital.id }}">{{ hospital.name }} - {{ hospital.address }}</option>
                                {% empty %}
                                    <option>No hospitals available</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="id_date" class="form-label">Select Date:</label>
                            <input type="date" name="date" id="id_date" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="id_time" class="form-label">Select Time:</label>
                            <input type="time" name="time" id="id_time" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100">Book Appointment</button>
                    </form>
                </div>
              
            </div>
        </div>
    </div>
</div>

{% endblock %}
